<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reservar · Hotel Arena Azul (demo)</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    :root { --bg: #f4f7f8; --card: #fff; --text: #14262d; --muted: #5b6d73; --brand: #0b5c7b; --coral: #f07a5c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b1a20; --card: #12262e; --text: #e8f1f3; --muted: #9db3b9; --brand: #6fb2c0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { background: var(--card); max-width: 460px; border-radius: 20px; padding: 32px 28px; box-shadow: 0 10px 40px #0002; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.35rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 14px; }
    a.btn { display: inline-block; margin-top: 8px; background: var(--brand); color: #fff; text-decoration: none; font-weight: 600;
      padding: 12px 22px; border-radius: 999px; }
    @media (prefers-color-scheme: dark) { a.btn { color: #0b1a20; } }
  </style>
</head>
<body>
  <main>
    <img src="icon-192.png" alt="">
    <h1>Aquí se abre el motor de reservas del hotel</h1>
    <p>En la versión real, el botón «Reserva aquí» lleva al huésped a la página de pago o reservación que ya usa el hotel (motor de reservas, WhatsApp o formulario).</p>
    <p>Esta es una demostración con un hotel y datos ficticios.</p>
    <a class="btn" href="./#/calendario">Volver al calendario</a>
  </main>
</body>
</html>
